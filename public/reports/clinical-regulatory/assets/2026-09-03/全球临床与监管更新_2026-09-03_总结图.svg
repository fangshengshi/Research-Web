<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="全球临床与监管更新总结图">
<style>.t{font-family:Arial,"Microsoft YaHei",sans-serif;fill:#1f2c3a}.w{fill:#fff}.b{font-weight:700}.s{fill:#657383}</style>
<rect width="1600" height="900" fill="#f6f8fa"/><rect width="1600" height="122" fill="#192636"/>
<text x="62" y="62" class="w b" font-size="44">全球临床与监管更新</text>
<text x="62" y="97" fill="#d7e0e9" font-size="19">数据截止：2026-09-03 11:02（北京时间）｜主窗口：2026-08-27—2026-09-03</text>
<g transform="translate(55,145)"><rect width="1490" height="126" rx="18" fill="#fff" stroke="#d6dce3"/>
<text x="25" y="37" class="t b" font-size="23">阳性｜aficamten：非梗阻型肥厚型心肌病Ⅲ期成功</text>
<text x="25" y="73" class="t" font-size="17">ACACIA-HCM双主要终点达标：KCCQ-CSS组间差约3.0分；pVO2组间差约0.67 mL/kg/min。</text>
<text x="25" y="104" class="s" font-size="15">申报依据增强；LVEF低于50%为10.5%，对照组0.8%，安全监测将影响标签和使用便利性。</text></g>
<g transform="translate(55,286)"><rect width="1490" height="126" rx="18" fill="#fff" stroke="#d6dce3"/>
<text x="25" y="37" class="t b" font-size="23">阳性｜remibrutinib：两项复发型多发性硬化Ⅲ期均达主要终点</text>
<text x="25" y="73" class="t" font-size="17">REMODEL-1和REMODEL-2均降低ARR，并改善关键MRI终点；公司称未见符合Hy氏法则的肝损伤。</text>
<text x="25" y="104" class="s" font-size="15">上市申报把握增强；完整ARR、3mCDP和6mCDP效应量尚未披露。</text></g>
<g transform="translate(55,427)"><rect width="1490" height="126" rx="18" fill="#fff" stroke="#d6dce3"/>
<text x="25" y="37" class="t b" font-size="23">阴性｜apazunersen：安格曼综合征Ⅲ期失败</text>
<text x="25" y="73" class="t" font-size="17">Aspire未达到Bayley-4认知主要终点，也未达到MDRI关键次要终点。</text>
<text x="25" y="104" class="s" font-size="15">早期开放性研究中的改善未在随机对照Ⅲ期重复，项目继续开发和交易基础明显削弱。</text></g>
<g transform="translate(55,568)"><rect width="1490" height="126" rx="18" fill="#fff" stroke="#d6dce3"/>
<text x="25" y="37" class="t b" font-size="23">监管｜AMT-130：美国BLA和英国MAA已经提交</text>
<text x="25" y="73" class="t" font-size="17">uniQure申请FDA加速批准；目前确认到“已提交”，FDA尚未公布正式受理。</text>
<text x="25" y="104" class="s" font-size="15">下一步先看FDA是否受理并进入实质审评，提交本身不能直接提高最终获批判断。</text></g>
<g transform="translate(55,709)"><rect width="1490" height="126" rx="18" fill="#fff" stroke="#d6dce3"/>
<text x="25" y="37" class="t b" font-size="23">警示｜TNX-103：总体Ⅲ期失败，重症亚组有信号</text>
<text x="25" y="73" class="t" font-size="17">LEVEL总体6MWD组间差3.5米，p=0.63；KCCQ关键次要终点也未达到。</text>
<text x="25" y="104" class="s" font-size="15">低基线6MWD亚组可支持重新设计富集试验，不能把原Ⅲ期改写为阳性。</text></g>
<text x="62" y="878" class="s" font-size="15">图中信息来自本期报告，完整证据及来源见HTML正文；本图不替代原始证据。</text>
</svg>