<text class="title" x="68" y="91">全球临床与监管更新｜Clinical &amp; Regulatory</text>
<text class="sub" x="70" y="141">数据截止：2026-10-08 08:06（UTC+8）　｜　2026-10-10再核验　｜　怀格研究</text>
