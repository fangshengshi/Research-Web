<text x="1001" y="254" class="tag pos">阳性 · 中证据 · 随机Ⅲ期</text>
<text x="1001" y="306" class="head">艾可瑞妥单抗：高危初治DLBCL阳性</text>
<text x="1001" y="356" class="body">IPI 3–5主要人群：PFS HR 0.49</text>
<text x="1001" y="395" class="body">95%CI 0.35–0.69；P&lt;0.0001</text>
<text x="1001" y="443" class="body pos">一线注册依据增强，尚未获得新标签。</text>
<text x="1001" y="486" class="small">IPI 2–5为关键次要人群，HR同为0.49。</text>
<text x="1001" y="524" class="small">下一证据：绝对PFS、OS、CRS及严重感染。</text>
