<rect fill="#27658d" height="350" rx="3" width="7" x="970" y="591"></rect>
<text class="tag" fill="#27658d" x="1001" y="634">监管变化 · 高证据 · FDA正式批准</text>
<text class="head" x="1001" y="686">新标签：乳腺癌维持治疗与初治CLL</text>
<text class="body" x="1001" y="736">图卡替尼：PFS 24.9 vs 16.3个月；HR 0.64</text>
<text class="body" x="1001" y="775">匹妥布替尼：对BR的PFS HR 0.20</text>
<text class="body pos" x="1001" y="823">可用治疗阶段扩大；两项OS均未成熟。</text>
<text class="small" x="1001" y="866">保留诱导后无进展、无已知17p缺失等限制。</text>
<text class="small" x="1001" y="904">图卡替尼肝毒性黑框警告须纳入净获益。</text>
