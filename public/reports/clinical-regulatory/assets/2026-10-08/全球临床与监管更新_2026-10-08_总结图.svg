<text x="99" y="254" class="tag neg">阴性 · 中证据 · 随机Ⅲ期</text>
<text x="99" y="306" class="head">伏美替尼：一线主要PFS未达标</text>
<text x="99" y="356" class="body">BICR PFS 11.0 vs 9.5个月；HR 0.75</text>
<text x="99" y="395" class="body">95%CI 0.55–1.02；P=0.0654</text>
<text x="99" y="443" class="body neg">一线无化疗单药的海外注册前景转弱。</text>
<text x="99" y="486" class="small">研究者评估HR 0.61，无法替代主要终点。</text>
<text x="99" y="524" class="small">下一证据：评审差异原因、OS和注册方案。</text>
