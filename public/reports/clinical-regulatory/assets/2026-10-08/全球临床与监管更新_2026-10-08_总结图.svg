<text class="tag neg" x="99" y="254">阴性 · 中证据 · 随机Ⅲ期</text>
<text class="head" x="99" y="306">伏美替尼：一线主要PFS未达标</text>
<text class="body" x="99" y="356">BICR PFS 11.0 vs 9.5个月；HR 0.75</text>
<text class="body" x="99" y="395">95%CI 0.55–1.02；P=0.0654</text>
<text class="body neg" x="99" y="443">一线无化疗单药的海外注册前景转弱。</text>
<text class="small" x="99" y="486">研究者评估HR 0.61，无法替代主要终点。</text>
<text class="small" x="99" y="524">下一证据：评审差异原因、OS和注册方案。</text>
<rect fill="#ffffff" height="350" rx="12" stroke="#d9e2e5" width="882" x="970" y="211"></rect>
<rect fill="#14776e" height="350" rx="3" width="7" x="970" y="211"></rect>
<text class="tag pos" x="1001" y="254">阳性 · 中证据 · 随机Ⅲ期</text>
<text class="head" x="1001" y="306">艾可瑞妥单抗：高危初治DLBCL阳性</text>
<text class="body" x="1001" y="356">IPI 3–5主要人群：PFS HR 0.49</text>
<text class="body" x="1001" y="395">95%CI 0.35–0.69；P&lt;0.0001</text>
<text class="body pos" x="1001" y="443">一线注册依据增强，尚未获得新标签。</text>
<text class="small" x="1001" y="486">IPI 2–5为关键次要人群，HR同为0.49。</text>
<text class="small" x="1001" y="524">下一证据：绝对PFS、OS、CRS及严重感染。</text>
<rect fill="#ffffff" height="350" rx="12" stroke="#d9e2e5" width="870" x="68" y="591"></rect>
<rect fill="#94631a" height="350" rx="3" width="7" x="68" y="591"></rect>
<text class="tag gold" x="99" y="634">阳性与边界 · 中证据 · 免疫原性Ⅲ期</text>
<text class="head" x="99" y="686">VAX-31：主要终点达标，逐型有差异</text>
<text class="body" x="99" y="736">共有血清型主要路径28/28达标；</text>
<text class="body" x="99" y="775">对PCV21逐型新界值达标17/19。</text>
<text class="body gold" x="99" y="823">3、12F未达0.667界值；非疫苗整体失败。</text>
<text class="small" x="99" y="866">OPUS-1为初免成人；既往接种者另由OPUS-3回答。</text>
<text class="small" x="99" y="904">下一证据：OPUS-2/3及生产批次一致性。</text>
