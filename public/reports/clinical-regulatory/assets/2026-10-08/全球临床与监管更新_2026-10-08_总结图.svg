<svg aria-label="全球临床与监管更新：伏美替尼主要终点失败、艾可瑞妥单抗一线阳性、VAX-31逐型差异及FDA新标签" class="hero" height="1080" id="summary" role="img" viewBox="0 0 1920 1080" width="1920" xmlns="http://www.w3.org/2000/svg">
