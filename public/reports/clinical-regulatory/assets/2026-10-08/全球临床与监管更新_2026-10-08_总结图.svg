<text x="99" y="634" class="tag gold">阳性与边界 · 中证据 · 免疫原性Ⅲ期</text>
<text x="99" y="686" class="head">VAX-31：主要终点达标，逐型有差异</text>
<text x="99" y="736" class="body">共有血清型主要路径28/28达标；</text>
<text x="99" y="775" class="body">对PCV21逐型新界值达标17/19。</text>
<text x="99" y="823" class="body gold">3、12F未达0.667界值；非疫苗整体失败。</text>
<text x="99" y="866" class="small">31价疫苗另评估交叉反应20B，并非32价。</text>
<text x="99" y="904" class="small">下一证据：OPUS-2/3及生产批次一致性。</text>
