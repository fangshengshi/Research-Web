<text x="80" y="105" class="b t50">全球临床与监管更新｜Clinical &amp; Regulatory</text>
<text x="82" y="147" class="m t21">数据截止：2026-09-24 08:01（新加坡时间）｜主窗口：2026-09-17 08:02—2026-09-24 08:01</text>
<line x1="80" y1="164" x2="1840" y2="164" stroke="#2c3a52" stroke-width="2"/><rect x="80" y="202" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52" stroke-width="2"/><text x="110" y="253" class="b t19" style="fill:#74d69c">关键阳性｜中高证据</text><text x="108" y="306" class="b t26">Ulefnersen：FUS-ALS Ⅲ期首次跨过功能+</text><text x="108" y="344" class="b t26">生存复合终点</text><text x="108" y="390" class="m t19">FUSION主要分析N=73；72周joint-rank主要终点 p=0.0005；</text><text x="108" y="419" class="m t19">NfL及疾病进展复合次要终点亦显著。</text><text x="108" y="456" class="b t18" style="fill:#74d69c">临床成功概率显著提高，也强化基因分型ALS的ASO策略；</text><text x="108" y="484" class="b t18" style="fill:#74d69c">ALSFRS-R差值、死亡/永久通气HR尚未披露。</text><text x="108" y="518" class="m t16">下一注册级节点：FDA/全球监管沟通与完整效应量披露。</text><rect x="967" y="202" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52" stroke-width="2"/><text x="997" y="253" class="b t19" style="fill:#63d4d4">关键阳性｜中高证据</text><text x="995" y="306" class="b t26">Barzolvolimab：两项CSU Ⅲ期复制成功，KIT</text><text x="995" y="344" class="b t26">去除肥大细胞获注册级验证</text><text x="995" y="390" class="m t19">EMBARQ-CSU1/2合计N=1,939；W12 UAS7降幅约-20 vs</text><text x="995" y="419" class="m t19">安慰剂约-11；W24完全缓解约45%–54%。</text><text x="995" y="456" class="b t18" style="fill:#63d4d4">商业差异化更清楚：奥马珠单抗难治亚组仍有高完全缓解；</text><text x="995" y="484" class="b t18" style="fill:#63d4d4">公司“best-in-disease”仍属自身表述。</text><text x="995" y="518" class="m t16">下一节点：完整安全性表、52周数据与2027年BLA。</text><rect x="80" y="580" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52" stroke-width="2"/><text x="110" y="631" class="b t19" style="fill:#f3c56b">竞争判断校正｜中证据</text><text x="108" y="684" class="b t26">CagriSema：低剂量组合优于tirzepatide 5 mg，</text><text x="108" y="722" class="b t26">不能外推为“击败替尔泊肽全剂量”</text><text x="108" y="768" class="m t19">REIMAGINE 5：体重-12.4% vs -9.1%，HbA1c -1.71%</text><text x="108" y="797" class="m t19">vs -1.67%；REDEFINE 9：体重-21.0% vs -2.0%。</text><text x="108" y="834" class="b t18" style="fill:#f3c56b">支持1.0/1.0 mg剂量的商业灵活性；对tirzepatide 10/15 mg</text><text x="108" y="862" class="b t18" style="fill:#f3c56b">无直接比较，类别领先结论仍未建立。</text><text x="108" y="896" class="m t16">下一监管节点：CagriSema减重NDA预计2026Q4决定。</text><rect x="967" y="580" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52" stroke-width="2"/><text x="997" y="631" class="b t19" style="fill:#83b4ff">监管+基因治疗｜高/中高证据</text><text x="995" y="684" class="b t26">Fayuvi获批 + laru-zova关键试验阳性：</text><text x="995" y="722" class="b t26">罕见病基因治疗路径继续前移</text><text x="995" y="768" class="m t19">Fayuvi：AAV9一次静脉给药，单臂+历史对照获FDA批准；</text><text x="995" y="797" class="m t19">laru-zova：XLRP VISTA ≥15字母LLVA应答31.0%/24.1% vs 0%。</text><text x="995" y="834" class="b t18" style="fill:#83b4ff">路径信号：自然史可做外部对照的超罕见病仍有空间；</text><text x="995" y="862" class="b t18" style="fill:#83b4ff">眼科基因治疗已进入rolling BLA准备。</text><text x="995" y="896" class="m t16">下一节点：laru-zova 10月10日AAO完整VISTA数据。</text><rect x="80" y="957" width="1760" height="67" rx="16" fill="#162238"/><text x="108" y="982" class="t18">监管补充：FDA正式修改法规用语以纳入NAM（新方法学），但未取消动物研究或降低证据标准；</text><text x="108" y="1008" class="t18">Sefaxersen IgAN Ⅲ期37周UPCR主要终点已达，但降幅、CI与P值仍未公开，暂不接受“best-in-class”结论。</text><text x="80" y="1062" class="m t16">图中信息来自本期报告，完整证据及来源见HTML正文；本图不替代原始证据。</text></svg>