<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="全球临床与监管更新总结图"><rect width="1920" height="1080" fill="#0b1220"/><style>text{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#eef4ff}.m{fill:#a9b7ce}.h{font-weight:700}.g{fill:#74d69c}.c{fill:#63d4d4}.a{fill:#f3c56b}.r{fill:#ff8a8a}.t50{font-size:50px}.t28{font-size:28px}.t22{font-size:22px}.t20{font-size:20px}.t18{font-size:18px}</style><text x="80" y="105" class="h t50">全球临床与监管更新｜Clinical &amp; Regulatory</text><text x="82" y="148" class="m t22">数据截止：2026-09-17 08:02（新加坡时间）｜主窗口：2026-09-10 08:00—2026-09-17 08:02</text><line x1="80" y1="166" x2="1840" y2="166" stroke="#2c3a52" stroke-width="2"/><rect x="80" y="205" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52"/><text x="108" y="255" class="g h t20">OS确认｜高证据</text><text x="108" y="315" class="h t28">HARMONi-2：依沃西一线OS优势已量化</text><text x="108" y="365" class="m t22">mOS 30.8 vs 22.6个月；HR 0.73（95%CI 0.57–0.95），P=0.009。</text><text x="108" y="415" class="g h t20">36个月中位随访；TPS≥50% HR 0.58，TPS 1–49% HR 0.85。</text><text x="108" y="465" class="m t18">下一注册级证据：HARMONi-7 / HARMONi-3全球可复制性。</text><rect x="967" y="205" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52"/><text x="995" y="255" class="c h t20">类别验证｜高证据</text><text x="995" y="315" class="h t28">复发SCLC：两款B7-H3 ADC同周Ⅲ期OS阳性</text><text x="995" y="365" class="m t22">Ris-Rez：18.5 vs 10.3个月，HR 0.46；Tam-Peli：13.3 vs 9.4个月，HR 0.46。</text><text x="995" y="415" class="c h t20">两项均显著优于topotecan，类别进入随机生存获益阶段。</text><text x="995" y="465" class="m t18">人群与随访不同，不可据中位OS横向排名。</text><rect x="80" y="583" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52"/><text x="108" y="633" class="a h t20">阳性但有边界｜高证据</text><text x="108" y="693" class="h t28">DESTINY-Lung04：T-DXd一线HER2突变NSCLC PFS成功</text><text x="108" y="743" class="m t22">PFS 14.3 vs 8.3个月，HR 0.63；ORR 70.0% vs 44.5%；当前OS HR 1.15。</text><text x="108" y="793" class="a h t20">药物相关ILD/肺炎20.8%，成熟OS决定净临床获益上限。</text><text x="108" y="843" class="m t18">下一证据：成熟OS、后续治疗校正和长期肺毒性。</text><rect x="967" y="583" width="853" height="350" rx="22" fill="#121c2e" stroke="#2c3a52"/><text x="995" y="633" class="r h t20">关键阴性 + 监管｜高证据</text><text x="995" y="693" class="h t28">SERENA-4失败，收窄camizestrant广泛前移预期</text><text x="995" y="743" class="m t22">无筛选一线全人群PFS未达显著；SERENA-6的ESR1 ctDNA换药标签仍成立。</text><text x="995" y="793" class="r h t20">开发优势更集中于获得性ESR1突变场景。</text><text x="995" y="843" class="m t18">FDA 9/15启动Expedited IND Pilot，允许pre-IND组件滚动审阅。</text><rect x="80" y="960" width="1760" height="64" rx="16" fill="#162238"/><text x="108" y="985" class="t18">监管补充：FDA 9/11批准Isembyld；BHV-7000因代谢物资料不足进入partial clinical hold，仅暂停新入组。</text><text x="80" y="1060" class="m t18">图中信息来自本期报告，完整证据及来源见HTML正文；本图不替代原始证据。</text></svg>