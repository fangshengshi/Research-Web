<!-- row3 -->
<text x="84" y="519" class="name">HER2+ 一线 GEA</text>
<text x="470" y="512" class="fact">zanidatamab 两套方案获批；三联</text><text x="470" y="542" class="fact">OS 26.4 vs 19.2 月，HR 0.72</text>
<text x="1140" y="512" class="judge">新增一线获批选择</text><text x="1140" y="542" class="fact">CPS≥1 与 KEYNOTE-811 直接竞争</text>
<text x="1642" y="512" class="heat">科 高｜药 高</text><text x="1642" y="542" class="heat">资 中｜竞 高</text>
