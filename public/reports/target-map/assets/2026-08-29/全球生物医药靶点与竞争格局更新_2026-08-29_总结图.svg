<!-- row1 -->
<text x="84" y="309" class="name">广谱 RAS｜胰腺癌</text>
<text x="470" y="302" class="fact">daraxonrasib 获 FDA 批准；</text><text x="470" y="332" class="fact">OS 13.2 vs 6.7 月，HR 0.40</text>
<text x="1140" y="302" class="judge">Leader：daraxonrasib</text><text x="1140" y="332" class="fact">后续项目需给出生存或治疗窗优势</text>
<text x="1642" y="302" class="heat">科 高｜药 高</text><text x="1642" y="332" class="heat">资 中｜竞 中</text>
<line x1="78" y1="365" x2="1840" y2="365" stroke="#e5eaf0"/>

<!-- row2 -->
<text x="84" y="414" class="name">心肌肌球蛋白｜nHCM</text>
<text x="470" y="407" class="fact">aficamten III 期达到 KCCQ 与 pVO2</text><text x="470" y="437" class="fact">LVEF&lt;50%：10.5% vs 0.8%</text>
<text x="1140" y="407" class="judge">Leader：aficamten</text><text x="1140" y="437" class="fact">疗效成立；监测与心衰风险影响采用</text>
