name: Verify completed AI4S 2026-10-02 publication
on:
  push:
    branches: [publish/ai4s-20261002-verified]
    paths: [.github/workflows/publish-ai4s-20261002-once.yml]
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify original content and preserve offline single-file download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.RESEARCH_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, base64, hashlib, re, urllib.request, urllib.error
          def api(repo,path,token,body=None,missing=False):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if body is None else json.dumps(body).encode(),headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'verified-ai4s-publisher'},method='GET' if body is None else 'PUT')
              try:
                  with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
              except urllib.error.HTTPError as e:
                  if missing and e.code==404:return None
                  raise
          repo='fangshengshi/Research-Web';token=os.environ['GH_TOKEN']
          original=base64.b64decode(api(repo,'/git/blobs/9e3c08c57bb48e5ec2a10b9ab536c4fd9f536e53',token)['content'])
          assert len(original)==404887 and hashlib.sha256(original).hexdigest()=='3851483a1f2a7bcb095e94672f3fc2c89945b70a4edb3d4cad32b67fcfef40e4'
          source=api('fangshengshi/Research','/contents/ai4s/reports/2026/AI4S_Biopharma_Weekly_2026-10-02.html?ref=main',os.environ['SOURCE_TOKEN'])
          text=original.decode('utf-8')
          images=list(dict.fromkeys(re.findall(r'data:image/webp;base64,[^\"]+',text)))
          assert len(images)==3
          for s,name in zip(images,['cover','lab-loop','provenance']):text=text.replace(s,'/assets/ai4s/2026-10-02/'+name+'.webp')
          assert source['sha']=='b65af6dc112682b57637241bd3ff4b541ad1196a'
          assert base64.b64decode(source['content'])==text.encode(), 'Source body/layout changed'
          p='public/downloads/AI4S_Biopharma_Weekly_2026-10-02.html'
          old=api(repo,'/contents/'+p+'?ref=main',token,missing=True)
          if not old or old['sha']!='9e3c08c57bb48e5ec2a10b9ab536c4fd9f536e53':
              body={'message':'Preserve original single-file AI4S 2026-10-02 download','content':base64.b64encode(original).decode(),'branch':'main'}
              if old:body['sha']=old['sha']
              api(repo,'/contents/'+p,token,body)
          saved=api(repo,'/contents/'+p+'?ref=main',token)
          assert saved['sha']=='9e3c08c57bb48e5ec2a10b9ab536c4fd9f536e53'
          print('Source report body and layout are unchanged; three original images use published assets.')
          print('Original offline download verified: 404887 bytes, SHA-256 3851483a1f2a7bcb095e94672f3fc2c89945b70a4edb3d4cad32b67fcfef40e4')
          PY
      - name: Run existing portal sync and wait for completion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request
          from datetime import datetime,timezone,timedelta
          base='https://api.github.com/repos/fangshengshi/Research-Web'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'verified-ai4s-publisher'}
          def call(p,b=None):
              req=urllib.request.Request(base+p,data=None if b is None else json.dumps(b).encode(),headers=headers,method='GET' if b is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=r.read();return json.loads(data) if data else None
          after=(datetime.now(timezone.utc)-timedelta(seconds=3)).isoformat()
          call('/actions/workflows/sync-research.yml/dispatches',{'ref':'main'})
          run=None
          for i in range(48):
              runs=call('/actions/workflows/sync-research.yml/runs?event=workflow_dispatch&per_page=5')['workflow_runs']
              candidates=[r for r in runs if r['created_at']>=after[:19]+'Z']
              if candidates:
                  run=max(candidates,key=lambda r:r['id'])
                  if run['status']=='completed':break
              time.sleep(10)
          assert run and run['status']=='completed' and run['conclusion']=='success', 'Existing sync did not complete successfully'
          print('EXISTING_SYNC_RUN',run['id'],run['conclusion'],run['html_url'])
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Existing sync completed successfully: '+run['html_url']+'\n\n')
          PY
      - name: Verify live portal, archived HTML, download and three images
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,time,re,hashlib
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          base='https://research-web-ez4.pages.dev'
          report='/reports/ai4s/reports/2026/AI4S_Biopharma_Weekly_2026-10-02.html'
          class Page(HTMLParser):
              def __init__(self):super().__init__();self.images=[];self.frames=[];self.headings=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='img':self.images.append(a.get('src',''))
                  if tag=='iframe':self.frames.append(a.get('src',''))
                  if tag=='h2':self.headings+=1
          def get(path):
              req=urllib.request.Request(urljoin(base,path),headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=40) as r:return r.status,r.headers.get_content_type(),r.read()
          complete=False
          for attempt in range(24):
              try:
                  status,mime,b=get(report)
                  s=b.decode('utf-8');p=Page();p.feed(s)
                  assert status==200 and mime=='text/html' and 'AI4S 生物医药产业与投资观察周报｜2026-10-02' in s and p.headings>=11
                  assert len(p.images)==4 and len(set(p.images))==3
                  for image in set(p.images):
                      code,kind,raw=get(image)
                      assert code==200 and raw[:4]==b'RIFF' and raw[8:12]==b'WEBP'
                  code,kind,wrapper=get('/ai4s/latest/')
                  assert code==200 and kind=='text/html'
                  latest=Page();latest.feed(wrapper.decode('utf-8'))
                  assert latest.frames, 'Latest portal has no report frame'
                  for frame in latest.frames:
                      code,kind,fr=get(frame)
                      assert code==200 and 'AI4S 生物医药产业与投资观察周报｜2026-10-02' in fr.decode('utf-8')
                  code,kind,download=get('/downloads/AI4S_Biopharma_Weekly_2026-10-02.html')
                  assert code==200 and 'data:image/webp;base64,' in download.decode('utf-8')
                  complete=True;break
              except Exception as ex:
                  print('Waiting for deployment:',attempt+1,type(ex).__name__)
                  time.sleep(10)
          assert complete, 'Live deployment checks did not finish successfully'
          message='Cloudflare verified: latest portal, October 2 archive, original offline download, and three WebP images all returned valid HTTP 200 content.\n'
          print(message)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write(message)
          PY
